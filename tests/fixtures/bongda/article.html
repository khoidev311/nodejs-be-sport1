  function cleanEmptyAdsBoxes() {
    const adsBoxes = document.querySelectorAll('.pc_hp')
    const adsBoxesMr = document.querySelector('.pc_mr')

    adsBoxes.forEach((box) => {
      const iframe = box.querySelector('iframe')
      if (!iframe || iframe.offsetHeight <= 10 || getComputedStyle(iframe).display === 'none') {
        box.classList.add('no-ads')
      }
    })

    if (adsBoxesMr) {
      const iframe = adsBoxesMr.querySelector('iframe')
      if (!iframe || iframe.offsetHeight <= 10 || getComputedStyle(iframe).display === 'none') {
        adsBoxesMr.classList.add('no-ads')
      }
    }
  }

  window.addEventListener('load', () => {
    setTimeout(cleanEmptyAdsBoxes, 3000)
  })
</script>
